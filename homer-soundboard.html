<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Homer Soundboard 🍩</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #2a003f, #000);
    color: white;
    text-align: center;
    overflow-x: hidden;
  }

  h1 {
    margin-top: 25px;
    font-size: 40px;
    background: linear-gradient(90deg, #b300ff, #ff00aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    opacity: 0.7;
    margin-bottom: 20px;
  }

  .board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 30px;
  }

  .btn {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    color: white;
    font-weight: bold;
    font-size: 14px;

    background: linear-gradient(145deg, #6a00ff, #ff00cc);
    box-shadow: 0 0 15px #b300ff, inset 0 0 10px rgba(255,255,255,0.2);

    transition: transform 0.15s ease, box-shadow 0.2s ease;
    position: relative;
  }

  .btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px #ff00cc, 0 0 10px #6a00ff;
  }

  .btn:active {
    transform: scale(0.95);
  }

  .donut {
    position: absolute;
    top: -10px;
    right: -10px;
    font-size: 18px;
    animation: spin 3s linear infinite;
    opacity: 0.9;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .glow-bg {
    position: fixed;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, #b300ff55, transparent 70%);
    filter: blur(60px);
    top: 10%;
    left: 10%;
    z-index: -1;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(30px); }
  }
</style>
</head>

<body>

<div class="glow-bg"></div>

<h1>🍩 Homer Soundboard</h1>
<div class="subtitle">tap for chaos 😭🫱</div>

<div class="board">

    D'OH
    <div class="donut">🍩</div>
  </button>

  <button class="btn" onclick="playSound('soda')">

  <button class="btn" onclick="playSound('door')">

  <button class="btn" onclick="playSound('laugh')">

</div>
