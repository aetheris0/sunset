<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/genizymath/soundboard@main/" />
    <script src="sounds.js" type="module"></script>
    <script src="main.js" type="module"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b1021" />
    <title>Sunset Soundboard</title>
    <link href="style.css" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --sunset-pink: #ff739c;
        --sunset-orange: #ffad70;
        --sunset-gold: #ffd18a;
        --panel: rgba(35, 23, 43, .76);
        --panel-border: rgba(255, 190, 170, .16);
        --muted: #c4aebd;
      }
      * { box-sizing: border-box; }
      html { min-height: 100%; background: #160f20; }
      body {
        min-height: 100vh; margin: 0; padding: 42px clamp(16px, 4vw, 58px) 64px;
        color: #fff5f1;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
          radial-gradient(ellipse at 8% 0%, rgba(255, 105, 130, .22), transparent 38%),
          radial-gradient(ellipse at 92% 8%, rgba(255, 169, 91, .19), transparent 34%),
          linear-gradient(145deg, #17101f 0%, #241326 48%, #17101f 100%);
        background-attachment: fixed;
      }
      body::before {
        content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18;
        background-image: radial-gradient(rgba(255,255,255,.2) .7px, transparent .7px);
        background-size: 23px 23px; mask-image: linear-gradient(to bottom, black, transparent 75%);
      }
      .sunset-shell { width: min(1200px, 100%); margin: 0 auto; position: relative; }
      .hero { margin: 0 0 28px; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 8px; margin-bottom: 13px;
        color: #ffb18c; font-size: 11px; font-weight: 750; letter-spacing: .2em;
        text-transform: uppercase;
      }
      .sun-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff9b79; box-shadow: 0 0 14px #ff8b81; }
      h1 {
        margin: 0; font-size: clamp(38px, 6vw, 64px); line-height: .98;
        letter-spacing: -.065em; font-weight: 800;
        background: linear-gradient(100deg, #fff3e7 5%, #ffb18e 48%, #ff789f 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .hero p { margin: 13px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .01em; }
      #controls {
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
        padding: 13px; margin: 0 0 22px; border: 1px solid var(--panel-border);
        border-radius: 18px; background: var(--panel);
        box-shadow: 0 18px 50px rgba(0,0,0,.2), inset 0 1px rgba(255,255,255,.035);
        backdrop-filter: blur(18px);
      }
      button, input, select, textarea { font: inherit; }
      #controls button, #controls input, .tts-btn, .tts-close, .tts-select, .tts-textarea {
        border: 1px solid rgba(255, 190, 170, .17); border-radius: 11px;
        color: #fff4ef; background: rgba(255,255,255,.055);
        transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
      }
      #controls button { min-height: 42px; padding: 0 14px; font-size: 12px; font-weight: 650; cursor: pointer; }
      #controls button:hover, .tts-btn:hover, .tts-close:hover {
        border-color: rgba(255, 159, 145, .55); background: rgba(255, 133, 139, .13);
        transform: translateY(-1px);
      }
      #controls #stopButton { color: #ffc0a2; }
      #controls #searchInput {
        flex: 1 1 220px; min-width: 160px; height: 42px; padding: 0 14px;
        outline: none; font-size: 13px;
      }
      #controls input::placeholder, textarea::placeholder { color: #a991a4; }
      #controls input:focus, textarea:focus, select:focus {
        border-color: rgba(255, 151, 151, .7); box-shadow: 0 0 0 3px rgba(255, 119, 151, .1); outline: none;
      }
      #soundboard { min-height: 180px; }
      #soundboard > * { min-width: 0; }
      #soundboard button, #soundboard [role="button"] {
        border-radius: 13px; transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
      }
      #soundboard button:hover, #soundboard [role="button"]:hover {
        transform: translateY(-2px); border-color: rgba(255, 165, 142, .48);
        box-shadow: 0 9px 24px rgba(255, 105, 130, .11);
      }
      #soundboard button:active, #controls button:active { transform: scale(.98); }
      #soundboard input, #soundboard select {
        color: #fff2ed; background: rgba(255,255,255,.06);
        border: 1px solid var(--panel-border); border-radius: 10px; padding: 9px 11px;
      }
      #ttsPanel {
        margin: 0 0 22px; padding: 20px; border-radius: 18px;
        border: 1px solid var(--panel-border); background: var(--panel);
        box-shadow: 0 18px 50px rgba(0,0,0,.22); backdrop-filter: blur(18px);
      }
      #ttsPanel.hidden, .hidden { display: none !important; }
      .tts-panel-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
      .tts-title { font-weight:750; color:#ffd0b7; }
      .tts-close { width:34px; height:34px; cursor:pointer; }
      .tts-textarea { width:100%; min-height:100px; padding:12px; resize:vertical; }
      .tts-controls-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:14px; }
      .tts-control-group { display:flex; flex-direction:column; gap:8px; min-width:0; }
      .tts-control-group.full-width { grid-column:1/-1; }
      .tts-label, .tts-speaking-label { color:#d7bdc8; font-size:12px; font-weight:650; }
      .tts-val { color:#ffad91; margin-left:7px; }
      .tts-select { min-height:38px; padding:8px 10px; }
      .tts-slider { width:100%; accent-color:#ff8c91; }
      .tts-status { margin-top:15px; color:#ffbd9d; font-size:12px; }
      .tts-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
      .tts-btn { padding:10px 13px; cursor:pointer; font-size:12px; font-weight:700; }
      .tts-btn:disabled { opacity:.38; cursor:not-allowed; transform:none; }
      .tts-btn-speak { background:linear-gradient(110deg,#f17c91,#f3a16f); color:#271522; border:0; }
      .tts-speaking-display { margin-top:14px; padding:12px; border-radius:11px; background:rgba(255,255,255,.05); }
      .tts-current-word { color:#ffd09e; margin-left:8px; }
      @media (max-width: 620px) {
        body { padding: 28px 14px 42px; }
        #controls { border-radius:15px; }
        #controls button { flex:1 1 calc(50% - 10px); }
        #controls #searchInput { flex:1 1 100%; order:-1; }
        .tts-controls-grid { grid-template-columns:1fr; }
        .tts-control-group.full-width { grid-column:auto; }
      }
    </style>
  </head>

  <body>
    <main class="sunset-shell">
      <header class="hero">
        <div class="eyebrow"><span class="sun-dot"></span> SOUND COLLECTION</div>
        <h1>Sunset Soundboard</h1>
        <p>Your sounds, one smooth little soundboard. Search, save favorites, and play.</p>
      </header>
    <div id="controls">
      <button id="toggleFavorites" class="control-button favorites-toggle">
        ⭐ Favorites: OFF
      </button>
      <button id="toggleButton" class="control-button overlap-toggle">
        🔇 Overlap: OFF
      </button>
      <button id="stopButton" class="control-button stop-button">
        ⏹️ Stop All Sounds
      </button>
      <input id="searchInput" type="text" placeholder="Search sounds..." />
      <button id="ttsToggle" class="control-button tts-toggle">
        🗣️ Text-to-Speech
      </button>
    </div>
    <div id="ttsPanel" class="tts-panel hidden">
      <div class="tts-panel-header">
        <span class="tts-title">🎙️ Text-to-Speech</span>
        <button id="ttsClose" class="tts-close">✕</button>
      </div>
      <textarea
        id="ttsText"
        class="tts-textarea"
        placeholder="Type something to speak..."
      ></textarea>
      <div class="tts-controls-grid">
        <div class="tts-control-group full-width">
          <label class="tts-label">Voice</label>
          <select id="ttsVoice" class="tts-select"></select>
        </div>
        <div class="tts-control-group">
          <label class="tts-label">
            Volume
            <span id="ttsVolumeVal" class="tts-val">1.0</span>
          </label>
          <input
            type="range"
            id="ttsVolume"
            class="tts-slider"
            min="0"
            max="1"
            step="0.05"
            value="1"
          />
        </div>
        <div class="tts-control-group">
          <label class="tts-label">
            Rate
            <span id="ttsRateVal" class="tts-val">1.0</span>
          </label>
          <input
            type="range"
            id="ttsRate"
            class="tts-slider"
            min="0.1"
            max="10"
            step="0.1"
            value="1"
          />
        </div>
        <div class="tts-control-group">
          <label class="tts-label">
            Pitch
            <span id="ttsPitchVal" class="tts-val">1.0</span>
          </label>
          <input
            type="range"
            id="ttsPitch"
            class="tts-slider"
            min="0"
            max="2"
            step="0.05"
            value="1"
          />
        </div>
        <div class="tts-control-group">
          <label class="tts-label">Filter by Lang</label>
          <select id="ttsLangFilter" class="tts-select"></select>
        </div>
      </div>

      <div id="ttsStatus" class="tts-status">Ready</div>

      <div class="tts-actions">
        <button id="ttsSpeak" class="tts-btn tts-btn-speak">▶ Speak</button>
        <button id="ttsPause" class="tts-btn tts-btn-pause" disabled="">
          ⏸ Pause
        </button>
        <button id="ttsResume" class="tts-btn tts-btn-resume" disabled="">
          ▶ Resume
        </button>
        <button id="ttsStop" class="tts-btn tts-btn-stop" disabled="">
          ⏹ Stop
        </button>
        <button id="ttsReset" class="tts-btn tts-btn-reset">↺ Reset</button>
      </div>

      <div id="ttsSpeaking" class="tts-speaking-display hidden">
        <span class="tts-speaking-label">Now speaking:</span>
        <span id="ttsCurrentWord" class="tts-current-word"></span>
      </div>
    </div>

    <div id="soundboard"></div>
    </main>
  </body>
</html>
