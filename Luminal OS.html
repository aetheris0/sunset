<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luminal OS</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0d12;color:#eef1f7;overflow:hidden;font-family:system-ui,sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}#app.ready{display:block}#boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center;padding:24px}#boot.gone{display:none}.spinner{width:42px;height:42px;border:4px solid #ffffff26;border-top-color:white;border-radius:50%;animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.msg{color:#9aa4b5;font-size:14px}</style></head><body>
<div id="boot"><div class="spinner"></div><div class="msg" id="bootMsg">Loading Luminal OS…</div></div>
<iframe id="app" title="Luminal OS" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-pointer-lock allow-orientation-lock allow-modals allow-downloads"></iframe>
<script>
(()=>{'use strict';const BASE='https://gimmemoney.online/',KEY='luminal_os_html_cache_v1',boot=document.getElementById('boot'),msg=document.getElementById('bootMsg'),app=document.getElementById('app');
function inject(html){if(!/<base\b/i.test(html)){html=/<head([^>]*)>/i.test(html)?html.replace(/<head([^>]*)>/i,'<head$1><base href="'+BASE+'">'):'<base href="'+BASE+'">'+html}app.srcdoc=html;app.classList.add('ready');boot.classList.add('gone')}
async function fresh(){const r=await fetch(BASE,{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('Server returned '+r.status);const html=await r.text();if(!html||html.length<50)throw Error('Response looked empty');try{localStorage.setItem(KEY,html)}catch{}return html}
let cached;try{cached=localStorage.getItem(KEY)}catch{}if(cached&&cached.length>50){inject(cached);fresh().catch(()=>{})}else{setTimeout(()=>{if(!app.classList.contains('ready'))msg.textContent='Still loading…'},4000);fresh().then(inject).catch(()=>{app.removeAttribute('srcdoc');app.src=BASE;app.classList.add('ready');boot.classList.add('gone')})}
})();
</script></body></html>
